[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manzil"
version = "0.1.0"
description = "Manzil: Intelligent Traffic & Emergency Routing (FYP F26-104, FAST-NUCES Lahore)"
requires-python = ">=3.10"
dependencies = [
    "eclipse-sumo==1.28.0",
    "libsumo==1.28.0",
    "traci==1.28.0",
    "sumolib==1.28.0",
    "numpy==2.2.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.setuptools.packages.find]
include = ["manzil*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
