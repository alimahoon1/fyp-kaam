[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manzil"
version = "0.1.0"
description = "Manzil: Intelligent Traffic & Emergency Routing (FYP F26-104, FAST-NUCES Lahore)"
requires-python = ">=3.10"
dependencies = [
    "eclipse-sumo==1.28.0",
    "libsumo==1.28.0",
    "traci==1.28.0",
    "sumolib==1.28.0",
    "numpy==2.2.6",
    "matplotlib==3.10.9",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
]

# DQN training/evaluation (Phase 4). CPU build, e.g.:
#   pip install -e ".[rl]" --extra-index-url https://download.pytorch.org/whl/cpu
rl = [
    "torch==2.9.1",
]

# Dashboard API (Phase 5): python -m manzil.api
api = [
    "fastapi==0.162.5",
    "uvicorn==0.54.0",
    "websockets==15.0.1",
    "httpx==0.28.1",
]

# Vision track (YOLO inference / tracking on recorded video). Training runs on Kaggle
# (kaggle/yolo_train), which pins the same version.
vision = [
    "ultralytics==8.4.210",
]

[tool.setuptools.packages.find]
include = ["manzil*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
